name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: catch drift against the latest hd release

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install a prebuilt hd release
        uses: HerringtonDarkholme/setup-hd@v1
        with:
          version: latest
          node: true
      - name: Show the installed compiler
        run: hd --version
      - name: Check every example against hd
        run: node scripts/check-examples.mjs
